<app-modal
  [isOpen]="facade.isOpen()"
  (closed)="close()"
  [title]="facade.isEditMode() ? 'Edit Category' : 'Add New Category'"
>
  <form (submit)="$event.preventDefault(); submit()">
    <div class="form-group">
      <app-text-input
        label="Category Name"
        inputId="name"
        placeholder="e.g. Groceries"
        [value]="facade.form.data().name"
        (valueChange)="facade.form.updateField('name', $event)"
        [maxLength]="MAX_TEXT_LENGTH"
        [validations]="nameValidations"
        [serverError]="facade.form.errors().name"
      />
    </div>

    <div class="form-group">
      <app-type-selector
        label="Category Type"
        name="categoryType"
        [value]="facade.form.data().type"
        (valueChange)="facade.form.updateField('type', $event)"
      />
    </div>

    <div class="form-group">
      <fieldset>
        <legend>Color Tag</legend>
        <div class="color-grid">
          @for (c of availableColors; track c.color) {
            <button
              type="button"
              class="color-option"
              [style.background-color]="c.color"
              [class.selected]="facade.form.data().color === c.color"
              [class.used]="facade.isColorUsed(c.color)"
              (click)="selectColor(c.color)"
              [title]="c.name + (facade.isColorUsed(c.color) ? ' (Already in use)' : '')"
            >
              @if (facade.form.data().color === c.color) {
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="white"
                  stroke-width="3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              } @else if (facade.isColorUsed(c.color)) {
                <div class="used-indicator"></div>
              }
            </button>
          }
        </div>
      </fieldset>
    </div>

    @if (facade.form.globalError()) {
      <div class="form-error-summary" role="alert">
        {{ facade.form.globalError() }}
      </div>
    }

    <div class="actions">
      <app-primary-button
        type="submit"
        [disabled]="!facade.form.isValid()"
        [loading]="facade.form.isSubmitting()"
      >
        {{ facade.isEditMode() ? 'Save Changes' : 'Add Category' }}
      </app-primary-button>
    </div>
  </form>
</app-modal>
