<div class="date-picker-container">
  <div class="date-picker-controls">
    <div class="preset-selector">
      <app-select-input
        inputId="presetSelector"
        [showEmptyOption]="false"
        [options]="presets"
        [value]="presetControl.value ?? ''"
        (valueChange)="presetControl.setValue($event)"
      />
    </div>

    <mat-form-field class="range-selector">
      <mat-date-range-input (click)="picker.open()" [formGroup]="rangeForm" [rangePicker]="picker">
        <input matStartDate formControlName="start" placeholder="Start date" readonly />
        <input matEndDate formControlName="end" placeholder="End date" readonly />
      </mat-date-range-input>
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-date-range-picker #picker></mat-date-range-picker>
    </mat-form-field>
  </div>
</div>
