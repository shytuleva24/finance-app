<app-modal
  [isOpen]="facade.isModalOpen()"
  (closed)="close()"
  [title]="facade.isEditMode() ? 'Edit Transaction' : 'Add Transaction'"
>
  <form (submit)="$event.preventDefault(); submit()">
    <div class="form-group">
      <app-type-selector
        label="Transaction Type"
        [value]="facade.form.data().type"
        (valueChange)="facade.form.updateField('type', $event)"
      />
    </div>

    <div class="form-group">
      <app-select-input
        label="Category"
        inputId="categoryId"
        emptyLabel="Select a category"
        [options]="categoryOptions()"
        [value]="facade.form.data().categoryId"
        (valueChange)="facade.form.updateField('categoryId', $event)"
        [serverError]="facade.form.errors()['categoryId']"
      />
    </div>

    <div class="form-row">
      <app-number-input
        label="Amount"
        inputId="amount"
        placeholder="0.00"
        [value]="facade.form.data().amount"
        (valueChange)="facade.form.updateField('amount', $event)"
      />
      <app-date-input
        label="Date"
        inputId="date"
        [value]="facade.form.data().date"
        (valueChange)="facade.form.updateField('date', $event)"
      />
    </div>

    <app-text-input
      label="Description"
      inputId="description"
      placeholder="What was this for?"
      [value]="facade.form.data().description"
      (valueChange)="facade.form.updateField('description', $event)"
    />

    @if (facade.form.globalError()) {
      <div class="form-error-summary" role="alert">
        {{ facade.form.globalError() }}
      </div>
    }

    <div class="actions">
      <app-primary-button
        type="submit"
        [disabled]="!facade.form.isValid()"
        [loading]="facade.form.isSubmitting()"
      >
        {{ facade.isEditMode() ? 'Save Changes' : 'Add Transaction' }}
      </app-primary-button>
    </div>
  </form>
</app-modal>
